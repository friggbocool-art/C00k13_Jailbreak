name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          SPEC=$(find . -name project.yml -not -path "./build/*" | head -n 1)
          if [ -z "$SPEC" ]; then
            echo "project.yml not found. Repo contents:"
            find . -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV
          cd "$DIR"
          xcodegen generate

      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          xcodebuild \
            -project C00k13.xcodeproj \
            -scheme C00k13 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            SWIFT_VERSION=5.0 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          APP="build/Build/Products/Release-iphoneos/C00k13.app"
          if [ ! -d "$APP" ]; then
            echo "App not found:"
            find build -name "*.app"
            exit 1
          fi
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry C00k13.ipa Payload
          mv C00k13.ipa "$GITHUB_WORKSPACE/C00k13.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: C00k13-ipa
          path: C00k13.ipa
